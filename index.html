<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="//db.onlinewebfonts.com/c/d7e8a95865396cddca89b00080d2cba6?family=SoDo+Sans+SemiBold" rel="stylesheet" type="text/css"/>
    <link type="text/css" rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Starbucks Coffee Company VN </title>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <img class="logo" src="image/logo.jpg" alt="image" data-aspect="0">
            <div class="tab" href="#"> MENU </div>
            <div class="tab" href="#"> REWARDS </div>
            <div class="tab" href="#"> GIFT CARDS </div>
        </div>
        <div class="navbar-right">
            <div class="find-a-store">
                <img src="https://www.starbucks.vn/assets/images/map marker.svg" alt="image" data-aspect="0">
                <a> FIND A STORE </a>
            </div>
            <div class="sign-in"> Sign in </div>
            <div class="join-now"> Join now </div>
        </div>
        
    </div>

    <div class="container">
        <div class="product-container">
            <div class="product" style="background-color: #1e3932 ;">
                <div class="product-left" >
                    <img src="image/background.png" alt="image" />
                </div>
                <div class="product-right"></div>
            </div>
        </div>
    </div>
</body>
</html>
